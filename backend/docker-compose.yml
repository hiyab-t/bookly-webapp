services:
  db:
      image: postgres
      container_name: $POSTGRES_DB
      restart: always
      volumes: 
        - db-data:/db/docker-entrypoint-initdb.d
      ports: 
        - 5432:5432
      environment:
        POSTGRES_PASSWORD: $POSTGRES_PASSWORD
        POSTGRES_USER: $POSTGRES_USER
        POSTGRES_DB: $POSTGRES_DB
  app:
      depends_on:
      - db
      build: 
        context: .
      container_name: bookly_api
      hostname: bookly_api
      networks:
        - bookly_api_net
      env_file:
        - .env
volumes:
  db-data:

networks:
  bookly_api_net:
    driver: bridge