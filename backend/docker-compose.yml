services:
  db:
      image: postgres
      container_name: $POSTGRES_DB
      restart: always
      volumes: 
        - db-data:/db/docker-entrypoint-initdb.d
      ports: 
        - 5432:5432
      environment:
        POSTGRES_PASSWORD: $POSTGRES_PASSWORD
        POSTGRES_USER: $POSTGRES_USER
        POSTGRES_DB: $POSTGRES_DB
volumes:
  db-data: