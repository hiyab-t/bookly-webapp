<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bookly</title>
</head>
<body>
    <h2>
        Sign up
    </h2>
    <label>Name: <input type="text" id="name_id"></label>
    <br>
    <label>Email:<input type="text" id="email_id"></label>
    <br>
    <label>Password:<input type="text" id="psst_id"></label>
    <br>
    <input type="Submit" id="register">
    <script>
        document.addEventListener("DOMContentLoaded", function() {
                const register = document.getElementById("register");
                register.addEventListener("click", function(event) {
                    event.preventDefault();
                    
                    const name = document.getElementById("name_id").value;
                    const email = document.getElementById("email_id").value;
                    const password = document.getElementById("psst_id").value;
                    
                    const data = {
                        name: name,
                        email: email,
                        password: password
                    }
                
                    fetch("http://localhost:4000/v1/users", {
                        method: "POST",
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(
                            data
                        )
                    })
                    .then(res => res.json())
                    .then(json => console.log(json))
                    .catch(err => console.log(err.message));
                });
            });
        </script> 
</body>
</html>
